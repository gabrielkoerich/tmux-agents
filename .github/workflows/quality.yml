name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The audit falls back to grep without ripgrep, and apt retries a slow mirror
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=5 shellcheck

      - name: Bash syntax check
        run: |
          for f in agents.tmux scripts/* bin/*; do
            bash -n "$f"
          done

      - name: Security audit strict
        run: ./bin/security-audit --strict

  semgrep-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck + semgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=5 shellcheck
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Run strict audit with semgrep required
        env:
          SECURITY_AUDIT_REQUIRE_SEMGREP: "1"
        run: ./bin/security-audit --strict

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --config .gitleaks.toml --no-banner --redact --exit-code=1

  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats + tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=5 bats tmux

      - name: Run tests
        run: bats tests

  # tmux on macOS runs the scripts with its bash 3.2, so every version the scripts meet gets the tests.
  # Each bash is built from GNU's source, checked against a pinned hash, and cached
  bats-bash:
    name: bats (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bash: "3.2.57"
            sha256: 3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4
          - bash: "4.4.18"
            sha256: 604d9eec5e4ed5fd2180ee44dd756ddca92e0b6aa4217bbab2b6227380317f23
          - bash: "5.2.37"
            sha256: 9599b22ecd1d5787ad7d3b7bf0c59f312b3396d1e281175dd1f8a4014da621ff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats + tmux + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=5 bats tmux jq

      - name: Cache bash ${{ matrix.bash }}
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/bash-${{ matrix.bash }}
          key: bash-${{ matrix.bash }}-${{ matrix.sha256 }}

      # gcc 14 rejects the old C in bash 3.2 and 4.4 by default, these flags let it through as warnings
      - name: Build bash ${{ matrix.bash }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://ftp.gnu.org/gnu/bash/bash-${{ matrix.bash }}.tar.gz"
          echo "${{ matrix.sha256 }}  bash-${{ matrix.bash }}.tar.gz" | sha256sum -c -
          tar xzf "bash-${{ matrix.bash }}.tar.gz"
          cd "bash-${{ matrix.bash }}"
          ./configure --prefix="$HOME/bash-${{ matrix.bash }}" --without-bash-malloc \
            CFLAGS="-O2 -std=gnu89 -Wno-implicit-function-declaration -Wno-implicit-int -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-return-mismatch" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null

      - name: Run tests
        run: |
          export PATH="$HOME/bash-${{ matrix.bash }}/bin:$PATH"
          echo "testing with $(bash -c 'echo $BASH_VERSION')"
          bats tests
